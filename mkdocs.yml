site_name: "CIDR Metagenomics Hub"
site_url: https://gstt-cidr.github.io/network_hub/
repo_url: https://github.com/GSTT-CIDR/network_hub
site_author: CIDR
theme:
  name: readthedocs


markdown_extensions:
  - sane_lists
  - attr_list
  - tables
  - admonition


plugins:
  - mermaid2
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: numpy
            docstring_section_style: spacy
            show_source: false
  - mkdocs-pdf
  - mike
  - glightbox:
      touchNavigation: true
      loop: false
  - mkdocs-video:
      is_video: True
      video_autoplay: False
      css_style:
        width: "50%"
        height: "35%"

nav:
  - Introduction: 
    - Clinical metagenomics: index.md
  - Additional resources: 
    - Lab protocols: panmetagenomics_protocol.md
    - Clinical evaluation SOP: clinical_interpretation.md
    - Validation outline: validation_outline.md
    - Changelog: changelog.md
  - Bioinformatics:
    - Overview: bioinformatics_outline.md
    - Installation and validation: bioinformatics_install.md
    - Launching a sequencing experiment and analysis:   
      - Starting a MinKNOW experiment: running_metagenomics_workflow.md
      - Starting a Gourami experiment: running_metagenomics_workflow_gourami.md
      - Anonymising specimen data: anonymisation.md
    - Orthogonal analysis: 
      - Running organism queries: running_organism_query.md
      - Interpreting organism query results: interpreting_query.md
    - Limitations and bugs: limitations.md
    - Uploading to mSCAPE: mSCAPE_integration.md
    - Summary report: summary_report.md
  - Additional information: 
    - Technical descriptions: technical_information.md
    - Metagenomics sequence database: genome_database.md
  - Frequently asked questions: 
    - faq.md


